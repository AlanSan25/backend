services:
  api:
    build: .
    container_name: backend-api
    expose:
      - "3000"
    environment:
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    networks:
      - backend

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - backend

  redis:
    image: redis:alpine
    container_name: redis-cache
    expose:
      - "6379"
    networks:
      - backend

networks:
  backend:  
    driver: bridge